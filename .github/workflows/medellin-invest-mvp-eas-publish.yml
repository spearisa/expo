name: Publish to Expo Go (EAS Update)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/react-native-mvp-ui-FHLAn
    paths:
      - 'medellin-invest-mvp/**'
      - '.github/workflows/medellin-invest-mvp-eas-publish.yml'

jobs:
  update:
    name: Publish preview update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: medellin-invest-mvp
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check EXPO_TOKEN secret
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set. Add it at https://github.com/${{ github.repository }}/settings/secrets/actions/new"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install eas-cli
        run: npm install --no-save --no-audit --no-fund eas-cli

      - name: Verify auth
        run: npx eas-cli whoami

      - name: Initialize EAS project (idempotent)
        run: |
          if grep -q "REPLACE_WITH_PROJECT_ID" app.json; then
            echo "Linking project to Expo account…"
            npx eas-cli init --non-interactive --force
          else
            echo "Project already linked — skipping init"
          fi

      - name: Configure EAS Update (idempotent)
        run: npx eas-cli update:configure --non-interactive --platform all || true

      - name: Publish update
        id: publish
        run: |
          set -e
          OUT=$(npx eas-cli update --branch preview --message "CI publish ${{ github.sha }}" --non-interactive --json)
          echo "$OUT"
          echo "$OUT" > /tmp/update.json

      - name: Extract shareable link
        id: link
        run: |
          # eas-cli --json returns an array of update objects, one per platform.
          # manifestPermalink works in Expo Go via the `exp+` / deep-link redirect.
          IOS_URL=$(node -e '
            const data = JSON.parse(require("fs").readFileSync("/tmp/update.json","utf8"));
            const ios = (Array.isArray(data) ? data : [data]).find(u => u.platform === "ios") || data[0] || data;
            console.log(ios.manifestPermalink || ios.permalink || "");
          ')
          ANDROID_URL=$(node -e '
            const data = JSON.parse(require("fs").readFileSync("/tmp/update.json","utf8"));
            const and = (Array.isArray(data) ? data : [data]).find(u => u.platform === "android");
            console.log(and ? (and.manifestPermalink || and.permalink || "") : "");
          ')
          GROUP=$(node -e '
            const data = JSON.parse(require("fs").readFileSync("/tmp/update.json","utf8"));
            const first = Array.isArray(data) ? data[0] : data;
            console.log(first.group || first.updateGroup || "");
          ')
          echo "ios_url=$IOS_URL" >> "$GITHUB_OUTPUT"
          echo "android_url=$ANDROID_URL" >> "$GITHUB_OUTPUT"
          echo "group=$GROUP" >> "$GITHUB_OUTPUT"

      - name: Write summary with Expo Go link
        run: |
          {
            echo "# 📱 Open this app in Expo Go"
            echo ""
            echo "1. Install **Expo Go** on your phone (App Store / Play Store)."
            echo "2. Open this URL on your phone:"
            echo ""
            echo "   **iOS:** ${{ steps.link.outputs.ios_url }}"
            echo ""
            echo "   **Android:** ${{ steps.link.outputs.android_url }}"
            echo ""
            echo "3. Tap to open in Expo Go."
            echo ""
            echo "Update group id: \`${{ steps.link.outputs.group }}\`"
            echo ""
            echo "Re-run this workflow any time you want a fresh preview build."
          } >> "$GITHUB_STEP_SUMMARY"
