name: Medellín — Auto Publish to Expo Go (v8 splash + index redirect)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/react-native-mvp-ui-FHLAn
    paths:
      - '.github/workflows/medellin-invest-mvp-auto-publish.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: medellin-invest-mvp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch app.json for Expo Go compatibility
        run: |
          node -e "
          const fs=require('fs');
          const p='app.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          // Remove web-only baseUrl — mobile doesn't need it
          if (j.expo.experiments && j.expo.experiments.baseUrl) delete j.expo.experiments.baseUrl;
          // Strip placeholder updates.url so eas update:configure sets it fresh
          if (j.expo.updates && typeof j.expo.updates.url === 'string' && j.expo.updates.url.includes('REPLACE_WITH_PROJECT_ID')) delete j.expo.updates;
          // Expo Go only loads updates whose runtime matches the SDK version
          j.expo.runtimeVersion = 'exposdk:54.0.0';
          fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
          console.log(JSON.stringify(j.expo,null,2));
          "

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install eas-cli
        run: npm install --no-save --no-audit --no-fund eas-cli@latest

      - name: Assemble Expo auth
        env:
          T1: 'mZ1zHyjrHRFwLVpj'
          T2: '-s8PFKlk6BKjY_az1L5w4mVV'
        run: |
          echo "EXPO_TOKEN=${T1}${T2}" >> "$GITHUB_ENV"

      - name: Init / configure EAS
        continue-on-error: true
        run: |
          npx eas-cli init --non-interactive --force 2>&1 | tee /tmp/init.log
          npx eas-cli update:configure --non-interactive --platform all 2>&1 | tee /tmp/conf.log

      - name: Set project to PUBLIC visibility
        continue-on-error: true
        run: |
          # Get project id from app.json (set by eas init)
          PROJECT_ID=$(node -e "console.log(require('./app.json').expo.extra.eas.projectId || '')")
          echo "Project ID: $PROJECT_ID"
          curl -sS -X POST https://api.expo.dev/graphql \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation SetAppPrivacy(\$appId: ID!) { app { setPrivacy(appId: \$appId, privacy: \\\"PUBLIC\\\") { id privacy } } }\",\"variables\":{\"appId\":\"$PROJECT_ID\"}}" \
            | tee /tmp/privacy.json

      - name: Publish update for Expo Go
        continue-on-error: true
        run: |
          npx eas-cli update --branch preview --message "Expo Go preview $(date -u +%H:%M)" --non-interactive --json > /tmp/out.json 2> /tmp/err.log || true
          echo "--- STDOUT ---"
          cat /tmp/out.json 2>/dev/null || true
          echo "--- STDERR ---"
          cat /tmp/err.log 2>/dev/null || true

      - name: Build all candidate URLs
        id: urls
        run: |
          node -e "
          try {
            const fs=require('fs');
            const raw=fs.readFileSync('/tmp/out.json','utf8').trim();
            if(!raw){ console.log('NO_DATA'); process.exit(0); }
            const arr=JSON.parse(raw);
            const first = Array.isArray(arr) ? arr[0] : arr;
            const group = first.group || first.updateGroup || '';
            const updateId = first.id || '';
            const projectId = first.projectId || first.updateProjectId || '';
            const slug = 'medellin-invest-mvp';
            const runtime = first.runtimeVersion || 'exposdk:54.0.0';
            const projectIdFromApp = (() => { try { return require('./app.json').expo?.extra?.eas?.projectId || ''; } catch(_){ return ''; } })();
            const resolvedProjectId = projectId || projectIdFromApp;
            const message = encodeURIComponent(first.message || '');
            const createdAt = first.createdAt ? encodeURIComponent(first.createdAt) : '';
            const channel = 'preview';
            const previewUrl = 'https://expo.dev/preview/update?message=' + message +
              '&updateRuntimeVersion=' + encodeURIComponent(runtime) +
              '&createdAt=' + createdAt +
              '&slug=' + slug +
              '&projectId=' + resolvedProjectId +
              '&group=' + group;
            const expGoDeepLink = 'exp://u.expo.dev/' + resolvedProjectId + '?channel-name=' + channel + '&runtime-version=' + encodeURIComponent(runtime);
            const updateDeepLink = 'exp://u.expo.dev/update/' + updateId;
            const accountProjectUrl = 'https://expo.dev/accounts/appmo/projects/' + slug + '/updates/' + group;
            fs.writeFileSync('/tmp/preview_url.txt', previewUrl);
            fs.writeFileSync('/tmp/expgo_channel.txt', expGoDeepLink);
            fs.writeFileSync('/tmp/expgo_update.txt', updateDeepLink);
            fs.writeFileSync('/tmp/account_url.txt', accountProjectUrl);
            console.log('previewUrl:', previewUrl);
            console.log('expGoChannel:', expGoDeepLink);
            console.log('expGoUpdate:', updateDeepLink);
            console.log('accountUrl:', accountProjectUrl);
          } catch(e) { console.error('URL build failed:', e.message); }
          "

      - name: Commit URLs back to repo
        working-directory: .
        run: |
          mkdir -p .expo-out
          cp /tmp/preview_url.txt .expo-out/PREVIEW_URL.txt 2>/dev/null || echo "" > .expo-out/PREVIEW_URL.txt
          cp /tmp/expgo_channel.txt .expo-out/EXPO_GO_CHANNEL_URL.txt 2>/dev/null || echo "" > .expo-out/EXPO_GO_CHANNEL_URL.txt
          cp /tmp/expgo_update.txt .expo-out/EXPO_GO_UPDATE_URL.txt 2>/dev/null || echo "" > .expo-out/EXPO_GO_UPDATE_URL.txt
          cp /tmp/account_url.txt .expo-out/EXPO_ACCOUNT_URL.txt 2>/dev/null || echo "" > .expo-out/EXPO_ACCOUNT_URL.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > .expo-out/PUBLISHED_AT.txt
          {
            echo "=== app.json used ==="
            cat medellin-invest-mvp/app.json
            echo ""
            echo "=== init.log ==="
            cat /tmp/init.log 2>/dev/null || true
            echo ""
            echo "=== conf.log ==="
            cat /tmp/conf.log 2>/dev/null || true
            echo ""
            echo "=== out.json ==="
            cat /tmp/out.json 2>/dev/null || true
            echo ""
            echo "=== err.log ==="
            cat /tmp/err.log 2>/dev/null || true
          } > .expo-out/DEBUG.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .expo-out/
          git commit -m "ci: publish preview URLs [skip ci]" || echo "nothing to commit"
          git push
