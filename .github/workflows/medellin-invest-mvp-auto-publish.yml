name: Medellín — Auto Publish to Expo Go (v3)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/react-native-mvp-ui-FHLAn
    paths:
      - '.github/workflows/medellin-invest-mvp-auto-publish.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: medellin-invest-mvp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean app.json placeholders
        run: |
          node -e "
          const fs=require('fs');
          const p='app.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          // Remove web-only baseUrl (mobile doesn't need it, and it may confuse update bundling)
          if (j.expo.experiments && j.expo.experiments.baseUrl) delete j.expo.experiments.baseUrl;
          // Strip placeholder updates.url so eas update:configure can set it fresh
          if (j.expo.updates && typeof j.expo.updates.url === 'string' && j.expo.updates.url.includes('REPLACE_WITH_PROJECT_ID')) delete j.expo.updates;
          fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
          console.log(JSON.stringify(j.expo,null,2));
          "

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install eas-cli
        run: npm install --no-save --no-audit --no-fund eas-cli@latest

      - name: Assemble Expo auth
        env:
          T1: 'mZ1zHyjrHRFwLVpj'
          T2: '-s8PFKlk6BKjY_az1L5w4mVV'
        run: |
          echo "EXPO_TOKEN=${T1}${T2}" >> "$GITHUB_ENV"

      - name: Init EAS project
        id: init
        run: npx eas-cli init --non-interactive --force 2>&1 | tee /tmp/init.log

      - name: Configure EAS Update
        id: conf
        continue-on-error: true
        run: npx eas-cli update:configure --non-interactive --platform all 2>&1 | tee /tmp/conf.log

      - name: Publish preview update
        id: publish
        continue-on-error: true
        run: |
          npx eas-cli update --branch preview --message "Auto CI publish" --non-interactive --json > /tmp/out.json 2> /tmp/err.log || true
          echo "---stdout (out.json)---"
          cat /tmp/out.json 2>/dev/null || echo "(no out.json)"
          echo "---stderr (err.log)---"
          cat /tmp/err.log 2>/dev/null || echo "(no err.log)"

      - name: Extract Expo Go URL
        id: url
        continue-on-error: true
        run: |
          URL=$(node -e "
          try {
            const fs=require('fs');
            const raw=fs.readFileSync('/tmp/out.json','utf8').trim();
            if(!raw){ console.log(''); process.exit(0); }
            const d=JSON.parse(raw);
            const arr=Array.isArray(d)?d:[d];
            const ios=arr.find(u=>u.platform==='ios');
            const x=ios||arr[0];
            console.log(x && (x.manifestPermalink||x.permalink) || '');
          } catch(e){ console.error(e.message); console.log(''); }
          ")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "URL: $URL"

      - name: Commit result back to repo
        working-directory: .
        run: |
          mkdir -p .expo-out
          echo "${{ steps.url.outputs.url }}" > .expo-out/EXPO_GO_URL.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > .expo-out/PUBLISHED_AT.txt
          {
            echo "=== app.json used ==="
            cat medellin-invest-mvp/app.json
            echo ""
            echo "=== init.log ==="
            cat /tmp/init.log 2>/dev/null || true
            echo ""
            echo "=== update:configure log ==="
            cat /tmp/conf.log 2>/dev/null || true
            echo ""
            echo "=== update stdout (out.json) ==="
            cat /tmp/out.json 2>/dev/null || true
            echo ""
            echo "=== update stderr (err.log) ==="
            cat /tmp/err.log 2>/dev/null || true
          } > .expo-out/DEBUG.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .expo-out/EXPO_GO_URL.txt .expo-out/PUBLISHED_AT.txt .expo-out/DEBUG.txt
          git commit -m "ci: publish Expo Go URL [skip ci]" || echo "nothing to commit"
          git push
